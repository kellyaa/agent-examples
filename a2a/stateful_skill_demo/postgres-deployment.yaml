apiVersion: v1
kind: Secret
metadata:
  name: skill-demo-postgres
  namespace: team1
  labels:
    app.kubernetes.io/name: skill-demo-postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: kagenti
  POSTGRES_PASSWORD: kagenti-sessions-dev
  POSTGRES_DB: skill_demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skill-demo-postgres
  namespace: team1
  labels:
    app.kubernetes.io/name: skill-demo-postgres
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-demo-postgres
  namespace: team1
  labels:
    app.kubernetes.io/name: skill-demo-postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skill-demo-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skill-demo-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          envFrom:
            - secretRef:
                name: skill-demo-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skill-demo-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: skill-demo-postgres
  namespace: team1
  labels:
    app.kubernetes.io/name: skill-demo-postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: skill-demo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
